<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="title">
        <h1>Tetris</h1>
        <p class="subtitle">Clear lines. Don’t stack to the top.</p>
      </header>

      <main class="layout">
        <aside class="panel left">
          <section class="card">
            <h2>Hold</h2>
            <canvas id="hold" width="120" height="120" aria-label="Held piece"></canvas>
            <p class="hint">C or Shift</p>
          </section>
          <section class="card stats">
            <div><span>Score</span><strong id="score">0</strong></div>
            <div><span>Lines</span><strong id="lines">0</strong></div>
            <div><span>Level</span><strong id="level">1</strong></div>
          </section>
        </aside>

        <section class="board-wrap">
          <canvas id="board" width="300" height="600" aria-label="Tetris board"></canvas>
          <div id="overlay" class="overlay">
            <div class="overlay-card">
              <h2 id="overlay-title">Tetris</h2>
              <p id="overlay-text">Press Enter or click Start</p>
              <button id="start-btn" type="button">Start</button>
            </div>
          </div>
        </section>

        <aside class="panel right">
          <section class="card">
            <h2>Next</h2>
            <canvas id="next" width="120" height="360" aria-label="Next pieces"></canvas>
          </section>
          <section class="card controls">
            <h2>Controls</h2>
            <ul>
              <li><kbd>←</kbd><kbd>→</kbd> Move</li>
              <li><kbd>↑</kbd> / <kbd>X</kbd> Rotate</li>
              <li><kbd>Z</kbd> Rotate left</li>
              <li><kbd>↓</kbd> Soft drop</li>
              <li><kbd>Space</kbd> Hard drop</li>
              <li><kbd>P</kbd> Pause</li>
            </ul>
          </section>
        </aside>
      </main>

      <nav class="touch" aria-label="Touch controls">
        <button type="button" data-act="hold">Hold</button>
        <button type="button" data-act="rotL">↺</button>
        <button type="button" data-act="left">←</button>
        <button type="button" data-act="down">↓</button>
        <button type="button" data-act="right">→</button>
        <button type="button" data-act="rotR">↻</button>
        <button type="button" data-act="drop">Drop</button>
      </nav>
    </div>
    <script src="game.js"></script>
  </body>
</html>
